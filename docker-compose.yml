services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: taskmanager_db
    environment:
      POSTGRES_DB: taskmanager_db
      POSTGRES_USER: taskmanager_user
      POSTGRES_PASSWORD: taskmanager_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager_user -d taskmanager_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django Application ────────────────────────────────────────────────────
  web:
    build: .
    container_name: taskmanager_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"

    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db

volumes:
  postgres_data: